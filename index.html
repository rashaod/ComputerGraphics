<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home-Gym Planner</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- The 3D view. three.js draws into this canvas. -->
    <canvas id="view"></canvas>

    <!-- Control panel (plain HTML, no UI library). -->
    <div id="panel">
      <h1>Home-Gym Planner</h1>

      <h2>Room (cm)</h2>
      <label>Length (X) <span id="lengthVal"></span>
        <input id="length" type="range" min="200" max="800" step="10" value="400" /></label>
      <label>Width (Z) <span id="widthVal"></span>
        <input id="width" type="range" min="200" max="800" step="10" value="350" /></label>
      <label>Height (Y) <span id="heightVal"></span>
        <input id="height" type="range" min="200" max="350" step="5" value="250" /></label>

      <h2>Lighting (Phong, slide 22)</h2>
      <label><input id="useAmbient" type="checkbox" checked /> Ambient I<sub>a</sub></label>
      <label><input id="useDiffuse" type="checkbox" checked /> Diffuse I<sub>d</sub></label>
      <label><input id="useSpecular" type="checkbox" checked /> Specular I<sub>s</sub></label>
      <label>Lamp X <span id="lampXVal"></span>
        <input id="lampX" type="range" min="0" max="1" step="0.01" value="0.5" /></label>
      <label>Lamp Z <span id="lampZVal"></span>
        <input id="lampZ" type="range" min="0" max="1" step="0.01" value="0.5" /></label>

      <h2>Equipment meshes</h2>
      <label><input id="showWire" type="checkbox" /> Show triangles (wireframe)</label>
      <label><input id="showNormals" type="checkbox" /> Show vertex normals</label>
      <label>Vertex normals (Mesh slide 11)
        <select id="normalMethod">
          <option value="average">Plain average</option>
          <option value="area" selected>Area-weighted average</option>
        </select></label>
      <label>Look at
        <select id="lookAt"><option value="room">Whole room</option></select></label>
      <div id="meshStats" class="stats"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
